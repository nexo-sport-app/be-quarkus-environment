      clientId: nexo-microservice-client
      clientSecret: F7inmbxZULaikLDhU1JBL6PTWz4CZf85
      placement: basic_auth_header
    resourceOwner:
      username: mario.rossi
      password: password
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
  variables:
    - name: HOST
      value: http://localhost:8080{{PATH}}
