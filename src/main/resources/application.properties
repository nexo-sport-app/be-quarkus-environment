app.code=env
app.name=Environment
app.description=Environment microservice – Manage cross-microservice utility and configuration

## DATABASE
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.default-schema=environment

## FLYWAY
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=environment

## CACHE
quarkus.cache.type=redis
quarkus.cache.redis.expire-after-write=10M
quarkus.cache.redis.key-type=java.lang.String
#
quarkus.cache.redis."env.transcoding.list".expire-after-write=1H
quarkus.cache.redis."env.transcoding.list".key-type=java.lang.String
quarkus.cache.redis."env.transcoding.list".value-type=java.util.List
#
quarkus.cache.redis."env.transcoding.transcode".expire-after-write=30M
quarkus.cache.redis."env.transcoding.transcode".key-type=java.lang.String

## DEV (local nexo-platform compose stack; dev-only credentials, never reuse them elsewhere)
%dev.quarkus.devservices.enabled=false
%dev.quarkus.http.port=8081
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/nexo
%dev.quarkus.datasource.username=svc_env
%dev.quarkus.datasource.password=svc_env
%dev.quarkus.redis.hosts=redis://localhost:6379
%dev.quarkus.redis.password=admin
%dev.quarkus.oidc.auth-server-url=http://localhost:9090/realms/nexo

## TEST
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.redis.devservices.image-name=redis:7.2-alpine
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.flyway.locations=db/migration,db/testdata
