app.code=env
app.name=Environment
app.description=Environment microservice – Manage cross-microservice utility and configuration

quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true

## CACHE (build-time types for the Redis caches renamed in plan 01-04; the full Redis settings are declared in plan 01-06)
quarkus.cache.redis."env.transcoding.list".expire-after-write=1H
quarkus.cache.redis."env.transcoding.list".key-type=java.lang.String
quarkus.cache.redis."env.transcoding.list".value-type=java.util.List
quarkus.cache.redis."env.transcoding.transcode".expire-after-write=30M
quarkus.cache.redis."env.transcoding.transcode".key-type=java.lang.String
